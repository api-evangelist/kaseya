                $ref: '#/components/schemas/QueryActionResult_TaskModel_Task'
            text/json:
              schema:
                $ref: '#/components/schemas/QueryActionResult_TaskModel_Task'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryModel'
        required: true
    servers:
    - url: https://webservices2.autotask.net/ATServicesRest
