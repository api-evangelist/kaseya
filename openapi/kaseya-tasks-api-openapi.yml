      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TaskListSearchSelectOutputDtoIEnumerableResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListSearchSelectOutputDtoIEnumerableResponse'
            text/json:
              schema:
