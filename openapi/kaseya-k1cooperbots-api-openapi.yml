  /v2/kaseya-one/tickets/statuses/lookup/{id}:
    get:
      tags:
      - K1CooperBots
      operationId: GetK1TicketStatusesLookup
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/K1LookupOutputDto'
            application/json:
              schema:
                $ref: '#/components/schemas/K1LookupOutputDto'
            text/json:
              schema:
                $ref: '#/components/schemas/K1LookupOutputDto'
components:
  schemas:
    K1SearchCriteriaDto:
      type: object
      properties:
        term:
          type:
          - string
          - 'null'
      additionalProperties: false
    K1RolesLookupInputDto:
      type: object
      properties:
        InstanceId:
          type:
          - string
          - 'null'
        KaseyaOneOrganizationId:
          type:
          - string
          - 'null'
        search:
          $ref: '#/components/schemas/K1SearchCriteriaDto'
        TimeSpentBy:
          type:
          - string
          - 'null'
      additionalProperties: false
    K1LookupOutputDto:
      type: object
      properties:
        Id:
          type:
          - string
          - 'null'
        Value:
          type:
          - string
          - 'null'
        Description:
          type:
          - string
          - 'null'
        Name:
          type:
          - string
          - 'null'
      additionalProperties: false
    K1LookupInputDto:
      type: object
      properties:
        InstanceId:
          type:
          - string
          - 'null'
        KaseyaOneOrganizationId:
          type:
          - string
          - 'null'
        search:
          $ref: '#/components/schemas/K1SearchCriteriaDto'
      additionalProperties: false
    K1LookupOutputResponseDto:
      type: object
      properties:
        Value:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/K1LookupOutputDto'
        Next_link:
          type:
          - string
          - 'null'
      additionalProperties: false
  securitySchemes:
    bearerAuth:
      type: http
      description: JWT Authorization header using the Bearer scheme.
      scheme: bearer
      bearerFormat: JWT
