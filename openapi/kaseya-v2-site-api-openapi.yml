        '200':
          description: OK
          content:
            application/json:
              schema:
                description: Site data
                properties:
                  id:
                    type: integer
                    format: int64
                  uid:
                    type: string
                    description: Unique alphanumeric UID of this site
                  accountUid:
                    type: string
                    description: Unique alphanumeric UID of the account to which this site belongs
                  name:
                    type: string
                  description:
                    type: string
                  notes:
                    type: string
                  onDemand:
                    type: boolean
                  splashtopAutoInstall:
