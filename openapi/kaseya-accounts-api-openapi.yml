            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummaryOutputDtoIEnumerablePagedResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AccountSummaryOutputDtoIEnumerablePagedResponse'
  /v2/crm/accounts/summary/{id}:
    get:
      tags:
      - Accounts
      operationId: GetAccountSummary
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
