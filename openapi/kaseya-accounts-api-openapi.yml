            schema:
              $ref: '#/components/schemas/AccountPostInputDto'
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPostInputDto'
          text/json:
            schema:
              $ref: '#/components/schemas/AccountPostInputDto'
          application/*+json:
