openapi: 3.2.0
info:
  title: BMS API 2.0 Accounts API
  description: Documentation of APIs Version 2.0
  version: '2.0'
servers:
- url: https://api.bms.kaseya.com
security:
- bearerAuth: []
tags:
- name: Accounts
paths:
  /v2/crm/accounts/lookup:
    get:
      tags:
      - Accounts
      operationId: GetAccounts
      parameters:
      - name: Filter.Ids
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int32
      - name: Filter.Name
        in: query
        schema:
          type: string
      - name: Filter.WithSecurityScope
        in: query
        schema:
          type: boolean
      - name: Filter.WithInactiveAccounts
        in: query
        schema:
          type: boolean
      - name: Sort
        in: query
        schema:
          type: string
      - name: Exclude
        in: query
        schema:
          type: string
      - name: PageSize
        in: query
        schema:
          type: integer
          format: int32
      - name: PageNumber
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AccountLookupOutputDtoListResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLookupOutputDtoListResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AccountLookupOutputDtoListResponse'
  /v2/crm/accounts/summary:
