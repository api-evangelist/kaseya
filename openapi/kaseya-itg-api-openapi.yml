          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationNotesPutInputDto'
          text/json:
            schema:
              $ref: '#/components/schemas/OrganizationNotesPutInputDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/OrganizationNotesPutInputDto'
