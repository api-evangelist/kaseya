      tags:
      - ITG
      operationId: GetTicketGlobalSearch
      parameters:
      - name: Filter.Keyword
        in: query
        schema:
          type: string
      - name: Filter.AccountIds
        in: query
        schema:
          type: string
      - name: Sort
        in: query
        schema:
          type: string
      - name: Exclude
        in: query
        schema:
          type: string
      - name: PageSize
        in: query
        schema:
          type: integer
          format: int32
      - name: PageNumber
        in: query
        schema:
          type: integer
          format: int32
