components:
  schemas:
    ChecklistTaskOutputDto:
      type: object
      properties:
        Id:
          type: integer
          format: int64
        name:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        order:
          type: integer
          format: int32
      additionalProperties: false
    ITGAccessInfoDto:
      type: object
      properties:
        IsConnected:
          type: boolean
        IsEnabled:
          type: boolean
        AccessToken:
          type:
          - string
          - 'null'
        ExpiresIn:
          type:
          - string
          - 'null'
          format: date-time
        Subdomain:
          type:
          - string
          - 'null'
        UrlLocation:
          type:
          - string
          - 'null'
      additionalProperties: false
    ITGAccessInfoDtoResponse:
      type: object
      properties:
        Success:
          type: boolean
          readOnly: true
        Error:
          $ref: '#/components/schemas/ErrorInfo'
        Result:
          $ref: '#/components/schemas/ITGAccessInfoDto'
      additionalProperties: false
    ErrorInfo:
      type: object
      properties:
        Code:
