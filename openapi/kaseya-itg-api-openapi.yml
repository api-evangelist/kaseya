  /v2/integrations/itglue/checklists:
    get:
      tags:
      - ITG
      operationId: GetItgChecklists
      parameters:
      - name: Name
        in: query
        schema:
          type: string
      - name: accountId
        in: query
        required: true
        schema:
          type: integer
          format: int32
      - name: PageSize
        in: query
        schema:
          type: integer
          format: int32
      - name: PageNumber
        in: query
        schema:
          type: integer
          format: int32
