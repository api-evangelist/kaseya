  /v2/integrations/itglue/contacts/{itgContactId}/notes:
    get:
      tags:
      - ITG
      operationId: GetItgContactNotes
      parameters:
      - name: itgContactId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ITGContactNotesOutputDtoResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ITGContactNotesOutputDtoResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ITGContactNotesOutputDtoResponse'
    put:
      tags:
      - ITG
      operationId: PutITGContactNotes
      parameters:
      - name: itgContactId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/ContactNotesPutInputDto'
          application/json:
            schema:
              $ref: '#/components/schemas/ContactNotesPutInputDto'
          text/json:
            schema:
              $ref: '#/components/schemas/ContactNotesPutInputDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ContactNotesPutInputDto'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ITGContactNotesOutputDtoResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ITGContactNotesOutputDtoResponse'
            text/json:
              schema:
