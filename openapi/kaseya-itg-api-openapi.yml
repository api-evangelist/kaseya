openapi: 3.2.0
info:
  title: BMS API 2.0 ITG API
  description: Documentation of APIs Version 2.0
  version: '2.0'
servers:
- url: https://api.bms.kaseya.com
security:
- bearerAuth: []
tags:
- name: ITG
paths:
  /v2/integrations/itglue/accessinfo:
    get:
      tags:
      - ITG
      operationId: GetITGAccessInfo
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ITGAccessInfoDtoResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ITGAccessInfoDtoResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ITGAccessInfoDtoResponse'
  /v2/integrations/itglue/servicedesk/ticketsync:
    get:
      tags:
      - ITG
      operationId: GetTicketsSync
      parameters:
      - name: Filter.CreatedOnFrom
        in: query
        schema:
          type: string
          format: date-time
      - name: Filter.CreatedOnTo
        in: query
        schema:
          type: string
          format: date-time
      - name: Filter.ModifiedOnFrom
        in: query
        schema:
          type: string
          format: date-time
      - name: Filter.ModifiedOnTo
        in: query
        schema:
          type: string
          format: date-time
      - name: Sort
        in: query
        schema:
          type: string
      - name: Exclude
        in: query
        schema:
          type: string
      - name: PageSize
        in: query
        schema:
          type: integer
          format: int32
      - name: PageNumber
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TicketSyncOutputDtoIEnumerablePagedResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/TicketSyncOutputDtoIEnumerablePagedResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/TicketSyncOutputDtoIEnumerablePagedResponse'
  /v2/integrations/itglue/servicedesk/ticketsync/{ticketId}:
    get:
      tags:
      - ITG
      operationId: GetTicketSync
      parameters:
      - name: ticketId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TicketSyncOutputDtoResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/TicketSyncOutputDtoResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/TicketSyncOutputDtoResponse'
  /v2/integrations/itglue/servicedesk/globalsearch:
