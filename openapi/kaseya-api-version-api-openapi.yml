openapi: 3.2.0
info:
  version: v1
  title: Datto|Autotask PSA Rest API Version API
servers:
- url: https://webservices2.autotask.net/ATServicesRest
tags:
- name: API Version
paths:
  /VersionInformation:
    get:
      tags:
      - API Version
      operationId: ApiVersion_ApiVersionInformation
      parameters:
      - name: ApiIntegrationCode
        in: header
        description: API Integration Code
        required: true
        schema:
          type: string
      - name: UserName
        in: header
        description: User Name
        required: true
        schema:
          type: string
      - name: Secret
        in: header
        description: Secret
        required: true
        schema:
          type: string
      - name: ImpersonationResourceId
        in: header
        description: Impersonation Resource Key
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiVersionResultModel'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiVersionResultModel'
      summary: Api version api version information
      x-summary-source: derived
components:
  schemas:
    ApiVersionResultModel:
      type: object
      properties:
        apiVersions:
          type: array
          items:
            type: string
            readOnly: true
