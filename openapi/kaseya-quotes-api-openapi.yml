        required: true
        schema:
          type: string
      - name: ImpersonationResourceId
        in: header
        description: Impersonation Resource Key
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryActionResult_QuoteModel_Quote'
            text/json:
              schema:
                $ref: '#/components/schemas/QueryActionResult_QuoteModel_Quote'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    post:
      tags:
      - Quotes
      operationId: Quotes_Query
      parameters:
      - name: ApiIntegrationCode
        in: header
        description: API Integration Code
        required: true
        schema:
