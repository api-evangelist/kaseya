components:
  schemas:
    QuoteModel:
      type: object
      properties:
        id:
          format: int64
          type: integer
        approvalStatus:
          format: int32
          type: integer
        approvalStatusChangedByResourceID:
          format: int32
          type: integer
        approvalStatusChangedDate:
          format: date-time
          type: string
        billToLocationID:
          format: int32
          type: integer
        calculateTaxSeparately:
          type: boolean
        comment:
          type: string
        companyID:
          format: int32
          type: integer
        contactID:
          format: int32
          type: integer
        createDate:
          format: date-time
          type: string
        creatorResourceID:
          format: int32
          type: integer
        description:
          type: string
        effectiveDate:
          format: date-time
          type: string
        expirationDate:
          format: date-time
          type: string
        extApprovalContactResponse:
          format: int32
          type: integer
        extApprovalResponseDate:
          format: date-time
          type: string
        extApprovalResponseSignature:
          type: string
        externalQuoteNumber:
          type: string
        groupByID:
          format: int32
          type: integer
        impersonatorCreatorResourceID:
          format: int32
          type: integer
        isActive:
          type: boolean
        lastActivityDate:
          format: date-time
          type: string
        lastModifiedBy:
          format: int32
          type: integer
        lastPublishedByResourceID:
          format: int32
          type: integer
        lastPublishedDateTime:
          format: date-time
          type: string
        name:
          type: string
        opportunityID:
          format: int32
          type: integer
        paymentTerm:
          format: int32
          type: integer
        paymentType:
          format: int32
          type: integer
        primaryQuote:
          type: boolean
        proposalProjectID:
          format: int32
          type: integer
        purchaseOrderNumber:
          type: string
        quoteNumber:
          format: int32
          type: integer
        quoteTemplateID:
          format: int32
          type: integer
        shippingType:
          format: int32
          type: integer
        shipToLocationID:
          format: int32
          type: integer
        showEachTaxInGroup:
          type: boolean
        showTaxCategory:
          type: boolean
        soldToLocationID:
          format: int32
          type: integer
        taxRegionID:
          format: int32
          type: integer
    UserDefinedFieldInformationResultModel:
      type: object
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/Field'
            readOnly: true
    EntityInformationResultModel:
      type: object
      properties:
        info:
          $ref: '#/components/schemas/EntityInformationModel'
          readOnly: true
    FieldInformationModel:
      type: object
      properties:
        name:
          type: string
        dataType:
          type: string
        length:
          format: int32
          type: integer
        isRequired:
          type: boolean
        isReadOnly:
          type: boolean
        isQueryable:
          type: boolean
        isReference:
          type: boolean
        referenceEntityType:
          type: string
        isPickList:
          type: boolean
        picklistValues:
          type: array
          items:
            $ref: '#/components/schemas/PickListValue'
        picklistParentValueField:
          type: string
        isSupportedWebhookField:
          $ref: '#/components/schemas/Object'
    FieldInformationResultModel:
      type: object
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldInformationModel'
            readOnly: true
    QueryCountResultModel:
      type: object
      properties:
        queryCount:
          format: int32
          type: integer
    ItemQueryResultModel_QuoteModel_Quote:
      type: object
      properties:
        item:
          $ref: '#/components/schemas/QuoteModel'
    PickListValue:
      type: object
      properties:
        value:
          type: string
        label:
          type: string
        isDefaultValue:
          type: boolean
        sortOrder:
          format: int32
          type: integer
        parentValue:
          type: string
        isActive:
          type: boolean
        isSystem:
          type: boolean
    QueryModel:
      type: object
      properties:
        maxRecords:
          format: int32
          type: integer
        includeFields:
          type: array
          items:
            type: string
        filter:
          type: array
          items:
            $ref: '#/components/schemas/Filter'
      example:
        MaxRecords: 10
        IncludeFields: []
        Filter:
        - op: gt
          field: id
          value: 0
          udf: false
          items: []
    QueryActionResult_QuoteModel_Quote:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/QuoteModel'
        pageDetails:
          $ref: '#/components/schemas/PagingModel'
    Object:
      type: object
      properties: {}
    Field:
      type: object
      properties:
        name:
          type: string
        label:
          type: string
        type:
          type: string
        length:
          format: int32
          type: integer
        description:
          type: string
        isRequired:
          type: boolean
        isReadOnly:
          type: boolean
        isQueryable:
          type: boolean
        isReference:
          type: boolean
        referenceEntityType:
          type: string
        isPickList:
          type: boolean
        picklistValues:
          type: array
          items:
            $ref: '#/components/schemas/PickListValue'
        picklistParentValueField:
          type: string
        defaultValue:
          type: string
        isSupportedWebhookField:
          $ref: '#/components/schemas/Object'
    RestUserAccessLevel:
      type: object
      properties: {}
    EntityInformationModel:
      type: object
      properties:
        name:
          type: string
          readOnly: true
        canCreate:
          type: boolean
          readOnly: true
        canDelete:
          type: boolean
          readOnly: true
        canQuery:
          type: boolean
          readOnly: true
        canUpdate:
          type: boolean
          readOnly: true
        userAccessForCreate:
          $ref: '#/components/schemas/RestUserAccessLevel'
          readOnly: true
        userAccessForDelete:
          $ref: '#/components/schemas/RestUserAccessLevel'
          readOnly: true
        userAccessForQuery:
          $ref: '#/components/schemas/RestUserAccessLevel'
          readOnly: true
        userAccessForUpdate:
          $ref: '#/components/schemas/RestUserAccessLevel'
          readOnly: true
        hasUserDefinedFields:
          type: boolean
          readOnly: true
        supportsWebhookCallouts:
          type: boolean
          readOnly: true
    Filter:
      type: object
      properties:
        op:
          type: string
        field:
          type: string
        udf:
          type: boolean
        value:
          description: 'Can be either an Integer, String, Boolean, an Array of Integers, or an Array of Strings. '
          type: object
          properties: {}
        items:
          description: An Array of Filter objects
          type: array
          items:
            $ref: '#/components/schemas/Filter'
    OperationResultModel:
      type: object
      properties:
        itemId:
          $ref: '#/components/schemas/Object'
    PagingModel:
      type: object
      properties:
        count:
          format: int32
          type: integer
        requestCount:
          format: int32
          type: integer
          readOnly: true
        prevPageUrl:
          type: string
        nextPageUrl:
          type: string
