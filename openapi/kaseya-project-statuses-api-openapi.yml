openapi: 3.2.0
info:
  title: BMS API 2.0 Project Statuses API
  description: Documentation of APIs Version 2.0
  version: '2.0'
servers:
- url: https://api.bms.kaseya.com
security:
- bearerAuth: []
tags:
- name: Project Statuses
paths:
  /v2/project/statuses/search:
    post:
      tags:
      - Project Statuses
      operationId: GetProjectStatusesList
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/ProjectStatusesListInpuDto'
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectStatusesListInpuDto'
          text/json:
            schema:
              $ref: '#/components/schemas/ProjectStatusesListInpuDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ProjectStatusesListInpuDto'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProjectStatusesListOutputDtoIEnumerablePagedResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectStatusesListOutputDtoIEnumerablePagedResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ProjectStatusesListOutputDtoIEnumerablePagedResponse'
      summary: Get project statuses list
      x-summary-source: derived
  /v2/project/statuses/{id}:
    get:
      tags:
      - Project Statuses
      operationId: GetProjectStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProjectStatusOutputDtoResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectStatusOutputDtoResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ProjectStatusOutputDtoResponse'
      summary: Get project status
      x-summary-source: derived
    delete:
      tags:
      - Project Statuses
      operationId: DeleteProjectStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
      summary: Delete project status
      x-summary-source: derived
    put:
      tags:
      - Project Statuses
      operationId: PutProjectStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/ProjectStatusInputDto'
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectStatusInputDto'
          text/json:
            schema:
              $ref: '#/components/schemas/ProjectStatusInputDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ProjectStatusInputDto'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProjectStatusOutputDtoResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectStatusOutputDtoResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ProjectStatusOutputDtoResponse'
      summary: Put project status
      x-summary-source: derived
  /v2/project/statuses:
    post:
      tags:
      - Project Statuses
      operationId: PostProjectStatus
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/ProjectStatusInputDto'
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectStatusInputDto'
          text/json:
            schema:
              $ref: '#/components/schemas/ProjectStatusInputDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ProjectStatusInputDto'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProjectStatusOutputDtoResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectStatusOutputDtoResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ProjectStatusOutputDtoResponse'
      summary: Post project status
      x-summary-source: derived
  /v2/project/statuses/lookup:
    get:
      tags:
      - Project Statuses
      operationId: GetProjectStatusesLookup
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProjectStatusesLookupOutputDtoListResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectStatusesLookupOutputDtoListResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ProjectStatusesLookupOutputDtoListResponse'
      summary: Get project statuses lookup
      x-summary-source: derived
  /v2/project/statuses/{id}/reorder/{order}:
    put:
      tags:
      - Project Statuses
      operationId: PutProjectStatusOrder
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: order
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
      summary: Put project status order
      x-summary-source: derived
components:
  schemas:
    ProjectStatusOutputDtoResponse:
      type: object
      properties:
        Success:
          type: boolean
          readOnly: true
        Error:
          $ref: '#/components/schemas/ErrorInfo'
        Result:
          $ref: '#/components/schemas/ProjectStatusOutputDto'
      additionalProperties: false
    ProjectStatusesListFilterDto:
      type: object
      properties:
        Name:
          type:
          - string
          - 'null'
        IsSystem:
          type:
          - boolean
          - 'null'
        IsDefault:
          type:
          - boolean
          - 'null'
        IsActive:
          type:
          - boolean
          - 'null'
      additionalProperties: false
    ProjectStatusesListOutputDtoIEnumerablePagedResponse:
      type: object
      properties:
        Success:
          type: boolean
          readOnly: true
        Error:
          $ref: '#/components/schemas/ErrorInfo'
        Result:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ProjectStatusesListOutputDto'
        TotalRecords:
          type: integer
          format: int32
      additionalProperties: false
    ProjectStatusInputDto:
      type: object
      properties:
        Name:
          type:
          - string
          - 'null'
        Description:
          type:
          - string
          - 'null'
        IsDefault:
          type: boolean
        IsActive:
          type: boolean
        StageStatusId:
          type: integer
          format: int32
        Order:
          type: integer
          format: int32
        ColorId:
          type: integer
          format: int32
      additionalProperties: false
    ErrorInfo:
      type: object
