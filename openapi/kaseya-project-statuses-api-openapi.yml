          - 'null'
        Order:
          type: integer
          format: int32
      additionalProperties: false
    ProjectStatusesListInpuDto:
      type: object
      properties:
        PageSize:
          type: integer
          format: int32
        PageNumber:
          type: integer
          format: int32
        StartRowIndex:
          type: integer
          format: int32
          readOnly: true
        EndRowIndex:
          type: integer
          format: int32
          readOnly: true
        Sort:
          type:
          - string
          - 'null'
        Exclude:
          type:
          - string
          - 'null'
        Filter:
          $ref: '#/components/schemas/ProjectStatusesListFilterDto'
      additionalProperties: false
    ProjectStatusesListOutputDto:
      type: object
      properties:
        Id:
          type: integer
          format: int32
        Name:
          type:
          - string
          - 'null'
        Description:
          type:
          - string
          - 'null'
        IsSystem:
          type: boolean
        IsDefault:
          type: boolean
        IsActive:
          type: boolean
        StageStatusId:
          type: integer
          format: int32
        StageStatusName:
          type:
          - string
          - 'null'
        Order:
          type:
          - integer
          - 'null'
          format: int32
        ColorId:
          type: integer
          format: int32
        ColorName:
          type:
          - string
          - 'null'
      additionalProperties: false
    ProjectStatusOutputDto:
      type: object
      properties:
        Id:
          type: integer
          format: int32
        Name:
          type:
          - string
          - 'null'
        Description:
          type:
          - string
          - 'null'
        IsSystem:
          type: boolean
        IsDefault:
          type: boolean
        IsActive:
          type: boolean
        StageStatusId:
          type: integer
          format: int32
        StageStatusName:
          type:
          - string
          - 'null'
        Order:
          type: integer
          format: int32
        ColorId:
          type: integer
          format: int32
        ColorName:
          type:
          - string
          - 'null'
      additionalProperties: false
    ProjectStatusesLookupOutputDtoListResponse:
      type: object
      properties:
        Success:
          type: boolean
          readOnly: true
        Error:
          $ref: '#/components/schemas/ErrorInfo'
        Result:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ProjectStatusesLookupOutputDto'
      additionalProperties: false
  securitySchemes:
    bearerAuth:
      type: http
      description: JWT Authorization header using the Bearer scheme.
      scheme: bearer
      bearerFormat: JWT
