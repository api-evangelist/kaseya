            text/json:
              schema:
                $ref: '#/components/schemas/HardwareAssetsListSearchSelectOutputDtoIEnumerableResponse'
  /v2/servicedesk/hardwareasset/{assetId}:
    get:
      tags:
      - HardwareAsset
      operationId: GetHardwareAsset
      parameters:
      - name: assetId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/HardwareAssetOutputDtoResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/HardwareAssetOutputDtoResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/HardwareAssetOutputDtoResponse'
    put:
      tags:
      - HardwareAsset
      operationId: PutHardwareAsset
      parameters:
      - name: assetId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/HardwareAssetInputDto'
          application/json:
            schema:
              $ref: '#/components/schemas/HardwareAssetInputDto'
          text/json:
            schema:
              $ref: '#/components/schemas/HardwareAssetInputDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/HardwareAssetInputDto'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/HardwareAssetOutputDtoResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/HardwareAssetOutputDtoResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/HardwareAssetOutputDtoResponse'
  /v2/servicedesk/hardwareasset:
