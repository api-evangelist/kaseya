openapi: 3.2.0
info:
  title: BMS API 2.0 Hardware Asset API
  description: Documentation of APIs Version 2.0
  version: '2.0'
servers:
- url: https://api.bms.kaseya.com
security:
- bearerAuth: []
tags:
- name: HardwareAsset
paths:
  /v2/servicedesk/hardwareasset/{assetId}/tickets:
    get:
      tags:
      - HardwareAsset
      operationId: GetHardwareAssetTickets
      parameters:
      - name: assetId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: Sort
        in: query
        schema:
          type: string
      - name: Exclude
        in: query
        schema:
          type: string
      - name: PageSize
        in: query
        schema:
          type: integer
          format: int32
      - name: PageNumber
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TicketListDtoListResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/TicketListDtoListResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/TicketListDtoListResponse'
  /v2/servicedesk/hardwareasset/searchselect:
