    get:
      tags:
      - AccountInvoiceSettings
      operationId: AccountInvoiceSettings_Get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: ApiIntegrationCode
        in: header
        description: API Integration Code
        required: true
        schema:
          type: string
      - name: UserName
        in: header
        description: User Name
        required: true
        schema:
          type: string
      - name: Secret
        in: header
        description: Secret
        required: true
        schema:
          type: string
      - name: ImpersonationResourceId
        in: header
        description: Impersonation Resource Key
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountInvoiceSettingsResultModel'
            text/json:
              schema:
                $ref: '#/components/schemas/AccountInvoiceSettingsResultModel'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    put:
      tags:
      - AccountInvoiceSettings
      operationId: AccountInvoiceSettings_Put
      parameters:
