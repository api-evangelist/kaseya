components:
  schemas:
    AccountInvoiceSettingsResultModel:
      type: object
      properties:
        taxExempt:
          type: boolean
        taxRegionId:
          format: int32
          type: integer
        taxId:
          type: string
        invoiceEmailingEnabled:
          type: boolean
        contactRecipients:
          type: array
          items:
            format: int32
            type: integer
        resourceRecipients:
          type: array
          items:
            format: int32
            type: integer
        otherEmails:
          type: string
    UpdateContactRecipientsModel:
      type: object
      properties:
        items:
          type: array
          items:
            format: int32
            type: integer
    AddContactRecipientsResultModel:
      type: object
      properties:
        contactRecipients:
          type: array
          items:
            format: int32
            type: integer
            readOnly: true
    UpdateResourceRecipientsModel:
      type: object
      properties:
        items:
          type: array
          items:
            format: int32
            type: integer
    AddResourceRecipientsResultModel:
      type: object
      properties:
        resourceRecipients:
          type: array
          items:
            format: int32
            type: integer
            readOnly: true
    Object:
      type: object
      properties: {}
    OperationResultModel:
      type: object
      properties:
        itemId:
          $ref: '#/components/schemas/Object'
    UpdateAccountInvoiceSettingsModel:
      type: object
      properties:
        taxExempt:
          type: boolean
        taxRegionId:
          format: int32
          type: integer
        taxId:
          type: string
        invoiceEmailingEnabled:
          type: boolean
        otherEmails:
          type: string
