  /v2/finance/invoices/summary:
    get:
      tags:
      - Invoices
      operationId: GetInvoicesSummaryList
      parameters:
      - name: Filter.Id
        in: query
        schema:
          type: integer
          format: int32
      - name: Filter.InvoiceNumber
        in: query
        schema:
          type: string
      - name: Filter.AccountId
        in: query
        schema:
          type: integer
          format: int32
      - name: Filter.AccountName
        in: query
        schema:
          type: string
      - name: Filter.StatusId
        in: query
        schema:
          type: integer
          format: int32
      - name: Filter.CreatedFrom
        in: query
        schema:
          type: string
          format: date-time
      - name: Filter.CreatedTo
        in: query
        schema:
          type: string
          format: date-time
      - name: Filter.PostedToAccounting
        in: query
        schema:
          type: boolean
      - name: Sort
        in: query
        schema:
          type: string
      - name: Exclude
        in: query
        schema:
          type: string
      - name: PageSize
        in: query
        schema:
          type: integer
          format: int32
      - name: PageNumber
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/InvoiceSummaryOutputDtoListResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceSummaryOutputDtoListResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/InvoiceSummaryOutputDtoListResponse'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.bms.kaseya.com
  /v2/finance/invoices/{id}:
    get:
      tags:
      - Invoices
      operationId: GetInvoice
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
