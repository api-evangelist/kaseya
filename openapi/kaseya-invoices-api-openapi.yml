      operationId: GetInvoiceDetailsList
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/InvoiceDetailsListSearchSelectInputDto'
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceDetailsListSearchSelectInputDto'
          text/json:
            schema:
              $ref: '#/components/schemas/InvoiceDetailsListSearchSelectInputDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/InvoiceDetailsListSearchSelectInputDto'
      responses:
