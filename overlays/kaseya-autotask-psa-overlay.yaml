- target: $.info
  update:
    x-apievangelist-gaps:
    - id: swagger-2.0
      detail: Still published as Swagger 2.0, which cannot express OAuth2 flows,
        webhooks/callbacks, links or JSON Schema 2020-12.
    - id: no-security-definitions
      detail: securityDefinitions is empty. The real credentials (UserName, Secret,
        ApiIntegrationCode) are modelled as ordinary required header parameters on all
        3009 operations, so no tooling can recognise them as authentication.
    - id: no-summaries
      detail: Zero of the 3009 operations carry a summary or description.
    - id: thin-error-contract
      detail: Only 401 and 403 are declared, description-only, with no schema. The
        documented tenant-suspension behaviour on threshold breach is absent entirely.
    - id: no-idempotency
      detail: No idempotency key on any create; PUT and PATCH are both offered.
- target: $.securityDefinitions
  update:
    autotaskApiUser:
      type: apiKey
      name: UserName
      in: header
      description: >-
        Autotask REST authenticates with three static headers — UserName (the API-only
        user's e-mail), Secret (its password) and ApiIntegrationCode (the integration
        tracking identifier). Modelled here as a single scheme because Swagger 2.0
        cannot express a composite credential.
      x-companion-headers:
      - Secret
      - ApiIntegrationCode
      x-optional-headers:
      - ImpersonationResourceId
      x-docs: https://ww2.autotask.net/help/developerhelp/Content/APIs/REST/General_Topics/REST_Security_Auth.htm
- target: $.info
  update:
