method: searched
source: npm registry search, PyPI, GitHub orgs github.com/kaseya, github.com/datto,
  github.com/itglue, PowerShell Gallery, and the product API documentation
summary: >-
  Kaseya publishes almost no first-party API client libraries. Searches of npm, PyPI,
  RubyGems-adjacent registries and the three Kaseya-owned GitHub organizations
  (kaseya, datto, itglue) found exactly one first-party API wrapper — the IT Glue
  PowerShell module, published from the official itglue GitHub organization. Every
  other Kaseya/Datto/Autotask/IT Glue client on npm and PyPI is community-authored.
  The Datto and Kaseya GitHub organizations carry infrastructure and open-source
  contributions (dattobd, openzfs, libvirt forks, TightVNC) rather than API SDKs.
packages:
- language: powershell
  registry: github
  name: ITGlueAPI
  url: https://github.com/itglue/powershellwrapper
  install: Install-Module -Name ITGlueAPI
  official: true
  api: IT Glue API
  note: Published from the official itglue GitHub organization; described as "This
    PowerShell module acts as a wrapper for the IT Glue API."
