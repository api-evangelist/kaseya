official_server_note: >-
  Kaseya publishes no first-party Model Context Protocol server for any of its
  products. Searches of the Kaseya, Datto and IT Glue GitHub organizations, npm, the
  product documentation and the public MCP registries found only community-authored
  servers (listed under community_servers below). No mcp.kaseya.com or equivalent
  hosted endpoint exists, and no /.well-known/oauth-protected-resource is served on any
  Kaseya host. The tools below are a DERIVED candidate surface — a proposal grounded in
  real operationIds from the three published contracts, not something Kaseya ships.
