x-observation: >-
  Datto RMM is the only Kaseya surface small and well-summarised enough to be tool-ified
  wholesale — 65 operations, every one carrying a summary. Autotask's 3,009 operations
  are 190 entities x the same 12-operation CRUD template, so a faithful MCP server for
  Autotask should be built as a handful of parameterised tools over the entity name
  plus the entityInformation introspection endpoints, not as 3,009 generated tools.
