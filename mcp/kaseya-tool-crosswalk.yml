summary: >-
  Kaseya ships no first-party MCP server, so this crosswalk binds the DERIVED candidate
  tool set in mcp/kaseya-mcp.yml to the operationIds that actually exist in the three
  published contracts. Every row is verified against the spec: the tool's real input
  contract is that operation's parameters and requestBody. Confidence is high
  throughout because the tools were derived from the operations rather than matched to
  a published tool list — there is no vendor tool list to disagree with. The interesting
  finding is the rest_only side: 3,483 of the 3,509 published operations have no
  candidate tool, and the ratio is wildly uneven across the three products.
