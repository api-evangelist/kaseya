- aid: kaseya:datto-rmm
  name: Datto RMM API v2
  description: 'The Datto RMM REST API v2 gives programmatic access to the remote monitoring
    and management platform — devices, sites, site variables, alerts, jobs, audit data,
    filters, users, activity logs and account settings. It publishes an anonymous OpenAPI
    3.1.0 document (61 paths, 65 operations, 123 schemas) at /api/v3/api-docs on each
    regional host, uses OAuth 2.0 access tokens issued at /auth/oauth/token, and enforces
    600 read and 100 write requests per rolling 60 seconds.'
  humanURL: https://rmm.datto.com/help/en/Content/2SETUP/APIv2.htm
  baseURL: https://syrah-api.centrastage.net/api
  image: https://www.kaseya.com/wp-content/uploads/2023/04/kaseya-logo.svg
