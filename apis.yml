- aid: kaseya:bms
  name: Kaseya BMS API 2.0
  description: 'The Kaseya BMS (Business Management Solution) V2 REST API exposes the
    professional services automation surface of BMS — tickets, accounts, contacts,
    contracts, opportunities, projects, timesheets, expenses, inventory, service desk
    templates, workflows, dashboards, webhook configuration and the Kaseya One (K1)
    access-control and CooperBot integrations. It is documented with a public Swagger
    UI and a public OpenAPI 3.0.1 document covering 349 paths and 435 operations.'
