apis:
- aid: kaseya:it-glue
  name: IT Glue API
  description: >-
    The IT Glue API is a JSON:API-conformant REST interface over the IT Glue IT-documentation platform
    — organizations, configurations, contacts, locations, passwords, documents, flexible assets and flexible
    asset types, domains, SSL certificates, users and related relationships. It is authenticated with
    an account-scoped API key sent in the x-api-key header and is documented with a Slate-style reference
    at api.itglue.com/developer. No OpenAPI document is published.
  humanURL: https://api.itglue.com/developer/
  baseURL: https://api.itglue.com
  image: https://www.kaseya.com/wp-content/uploads/2023/04/kaseya-logo.svg
  tags:
  - IT Documentation
  - Asset Management
  - Passwords
  properties:
  - type: Documentation
    url: https://api.itglue.com/developer/
  - type: GettingStarted
    url: >-
      https://help.itglue.kaseya.com/help/Content/1-admin/it-glue-api/getting-started-with-the-it-glue-api.html
  - type: SDKs
    url: https://github.com/itglue/powershellwrapper
- aid: kaseya:vsa9
  name: Kaseya VSA 9 REST API
  description: >-
    The Kaseya VSA 9 REST API lets third-party applications integrate with a VSA server and perform many
    of the tasks a VSA user performs in the product — agents, machine groups, organizations, assets, audit
    data, patch management, agent procedures, ticketing, alarms, service desk and system administration.
    Because VSA 9 is customer-hosted or tenant-hosted, the API is served from each customer's own VSA
    server root under /api/v1.0 rather than from a single vendor host.
  humanURL: https://help.vsa9.kaseya.com/help/Content/Modules/rest-api/home.htm
  baseURL: https://help.vsa9.kaseya.com/help/Content/Modules/rest-api/31615.htm
  x-base-url-pattern: https://{your-vsa-server}/api/v1.0
  x-base-url-note: >-
    VSA 9 is tenant/customer-hosted; the callable base URL is the customer's own VSA server root. The
    documentation reference URL is recorded here because Kaseya publishes no single vendor-hosted VSA
    9 API host.
  image: https://www.kaseya.com/wp-content/uploads/2023/04/kaseya-logo.svg
  tags:
  - Endpoint Management
  - Remote Monitoring and Management
  - Patch Management
  properties:
  - type: Documentation
    url: https://help.vsa9.kaseya.com/help/Content/Modules/rest-api/home.htm
  - type: APIReference
    url: https://help.vsa9.kaseya.com/help/Content/Modules/rest-api/31615.htm
- aid: kaseya:vsa10
  name: Kaseya VSA 10 API
  description: >-
    VSA 10 (formerly VSA X) exposes a REST API browsable from each tenant's own server at /api, with access
    controlled through VSA access tokens that carry explicit REST API (Read, Write) scopes, and through
    Trusted Applications which provide OAuth-based authorization without manually created API credentials.
    Tenants are hosted on subdomains of vsax.net.
  humanURL: https://help.vsa10.kaseya.com/help/Content/2-Administration/configuration/api.htm
  baseURL: https://vsax.net/api
  x-base-url-pattern: https://{tenant}.vsax.net/api
  x-base-url-note: VSA 10 is tenant-scoped; each customer's API lives on their own vsax.net subdomain.
  image: https://www.kaseya.com/wp-content/uploads/2023/04/kaseya-logo.svg
  tags:
  - Endpoint Management
  - Remote Monitoring and Management
  - Automation
  properties:
  - type: Documentation
    url: https://help.vsa10.kaseya.com/help/Content/2-Administration/configuration/api.htm
  - type: Authentication
    url: https://helpdesk.kaseya.com/hc/en-gb/articles/4705556673169-Use-VSA-Access-Token-API
- aid: kaseya:myitprocess
  name: myITprocess API
  description: >-
    myITprocess is Kaseya's strategic IT planning and QBR (quarterly business review) product for MSPs.
    It ships a REST API documented with Swagger UI at reporting.live.myitprocess.com, covering clients,
    initiatives, recommendations, meetings, review templates, categories and questions. The Swagger document
    itself requires an API key, so no anonymous machine-readable contract could be harvested.
  humanURL: https://helpdesk.kaseya.com/hc/en-gb/articles/4438175877521-myITprocess-API
  baseURL: https://reporting.live.myitprocess.com
  image: https://www.kaseya.com/wp-content/uploads/2023/04/kaseya-logo.svg
  tags:
