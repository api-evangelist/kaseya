aid: kaseya
name: Kaseya
description: 'Kaseya is a Miami-based provider of IT and security management software
  for managed service providers (MSPs) and internal IT teams, delivering its portfolio
  through the Kaseya 365 and IT Complete platforms. The company owns a large family
  of separately-branded products, several of which ship public REST APIs: Kaseya BMS
  (business management / PSA), Datto Autotask PSA, Datto RMM (remote monitoring and
  management), Kaseya VSA 9 and VSA 10 (endpoint management), IT Glue (IT documentation),
  myITprocess, Datto BCDR, SaaS Alerts, RocketCyber, Graphus, Spanning and Vonahi vPenTest.
  Kaseya publishes machine-readable contracts for three of these surfaces — the BMS
  API 2.0 (OpenAPI 3.0.1), the Datto|Autotask PSA REST API (Swagger 2.0, 3,000+ operations)
  and the Datto RMM API v2 (OpenAPI 3.1.0) — with the remainder documented in HTML help
  systems or behind tenant authentication.'
url: https://raw.githubusercontent.com/api-evangelist/kaseya/refs/heads/main/apis.yml
image: https://www.kaseya.com/wp-content/uploads/2023/04/kaseya-logo.svg
