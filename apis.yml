- aid: kaseya:it-glue
  name: IT Glue API
  description: 'The IT Glue API is a JSON:API-conformant REST interface over the IT
    Glue IT-documentation platform — organizations, configurations, contacts, locations,
    passwords, documents, flexible assets and flexible asset types, domains, SSL certificates,
    users and related relationships. It is authenticated with an account-scoped API
    key sent in the x-api-key header and is documented with a Slate-style reference
    at api.itglue.com/developer. No OpenAPI document is published.'
  humanURL: https://api.itglue.com/developer/
  baseURL: https://api.itglue.com
  image: https://www.kaseya.com/wp-content/uploads/2023/04/kaseya-logo.svg
  tags:
  - IT Documentation
  - Asset Management
  - Passwords
  properties:
