- aid: kaseya:autotask-psa
  name: Datto Autotask PSA REST API
  description: 'The Datto|Autotask PSA REST API is Kaseya''s largest published contract
    — a Swagger 2.0 document with 2,077 paths and 3,009 operations covering companies,
    contacts, tickets, projects, tasks, contracts, opportunities, quotes, invoices,
    time entries, configuration items, inventory, resources, checklists, webhooks and
    the full Autotask entity model (806 definitions). Requests are authenticated with
    ApiIntegrationCode, UserName and Secret headers and are served from zone-specific
    webservicesN.autotask.net hosts.'
  humanURL: https://ww2.autotask.net/help/developerhelp/Content/APIs/REST/REST_API_Home.htm
  baseURL: https://webservices2.autotask.net/ATServicesRest
